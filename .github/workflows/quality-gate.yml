name: Anatole Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: anatole-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: python -m pip install -e "apps/api[dev]"
      - name: Run FastAPI tests
        env:
          MARKET_DATA_PROVIDER: demo
        run: python -m pytest apps/api/tests -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Build Next.js
        env:
          ANATOLE_API_URL: https://anatole-api.onrender.com
          NEXT_PUBLIC_API_URL: https://anatole-api.onrender.com
        run: pnpm build:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API and web
        run: |
          python -m pip install -e "apps/api[dev]"
          pnpm install --no-frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run critical journeys
        env:
          MARKET_DATA_PROVIDER: demo
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
