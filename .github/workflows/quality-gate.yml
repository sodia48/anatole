name: Anatole Quality Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: anatole-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API
        run: python -m pip install -e "apps/api[dev]"
      - name: Run FastAPI tests
        env:
          MARKET_DATA_PROVIDER: demo
        run: python -m pytest apps/api/tests -q

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Test web rendering
        run: pnpm --dir apps/web test:unit
      - name: Test shared financial analytics
        run: node --test packages/shared/tests/*.test.mjs
      - name: Lint web
        run: pnpm --filter @anatole/web lint
      - name: Build Next.js
        env:
          ANATOLE_API_URL: https://anatole-api.onrender.com
          NEXT_PUBLIC_API_URL: https://anatole-api.onrender.com
        run: pnpm build:web
      - name: Enforce performance budgets
        run: pnpm check:performance

  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile
        run: pnpm typecheck:mobile
      - name: Lint mobile
        run: pnpm lint:mobile
      - name: Test mobile
        run: pnpm test:mobile

  e2e:
    # Playwright's WebKit dependencies target a supported LTS image. Keep this
    # fixed so ubuntu-latest cannot switch the E2E job to a new OS mid-rollout.
    runs-on: ubuntu-24.04
    # Match the pinned @playwright/test version. The official image includes
    # the browsers and OS libraries, avoiding slow apt mirror downloads.
    # Run the test process as a non-root user, as in Playwright's CI example.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    timeout-minutes: 45
    needs: [api-tests, web-build, mobile-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install API and web
        run: |
          python -m pip install -e "apps/api[dev]"
          pnpm install --frozen-lockfile
      - name: Run critical journeys
        env:
          MARKET_DATA_PROVIDER: demo
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
